# Deterministic Grafana config for visual baseline captures.
# Paths (data, logs, plugins, provisioning) and the HTTP port are injected as
# GF_* env vars by scripts/start-grafana.sh so each run starts from a clean DB.

app_mode = production
instance_name = visual-baseline

[server]
http_addr = 127.0.0.1
enable_gzip = false

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[security]
admin_user = admin
admin_password = admin
disable_gravatar = true
disable_initial_admin_creation = false

[users]
default_theme = dark
default_language = en-US
allow_sign_up = false

[auth]
# No forced password-change prompt after first admin login.
disable_login_form = false

[auth.anonymous]
enabled = false
# Removes the version + commit hash from the unauthenticated login footer; the
# commit differs between main and a migrated branch.
hide_version = true

[news]
news_feed_enabled = false

[grafana_net]
url = http://127.0.0.1:9

[grafana_com]
url = http://127.0.0.1:9
api_url = http://127.0.0.1:9/api

[plugins]
preinstall_disabled = true
plugin_admin_enabled = true

[unified_alerting]
enabled = true
# Rules are provisioned paused and never evaluated so rule state/health is stable.
execute_alerts = false

[unified_alerting.state_history]
enabled = false

[live]
max_connections = 100

[dashboards]
min_refresh_interval = 5s

[date_formats]
default_timezone = utc

[log]
mode = console
level = warn

[diagnostics.profiling]
enabled = false

[feature_toggles]
